services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://paperclip:paperclip@db:5432/paperclip
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
      # Credentials for the bundled CodeRabbit CLI, seeded into
      # /paperclip/.coderabbit by the entrypoint so agents can run
      # `coderabbit review --agent` headless. Optional: unset simply leaves the
      # CLI installed and signed out. See .env.example for how to produce it.
      CODERABBIT_AUTH_JSON_B64: "${CODERABBIT_AUTH_JSON_B64:-}"
      # The API-key fallback, for organizations that issue keys instead. Only
      # consulted when no credential exists yet; unlike the line above it costs
      # a call to CodeRabbit at boot, so prefer the pre-authenticated JSON.
      CODERABBIT_API_KEY: "${CODERABBIT_API_KEY:-}"
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  paperclip-data:
