name: PR

on:
  pull_request:
    branches:
      - main
      # TEA-Core fork: the deployed line is a fold branch, not `main`, so without
      # this every PR merged here reached production having run only the AI
      # reviewers. That is how the branch spent two days unable to compile.
      - 'fold/**'
  # SUP-12280 phase 2: the merge queue tests each entry against the real
  # post-merge state. The required checks (`verify`, `e2e`) only report on a
  # queue entry if this workflow also runs for `merge_group`; without it every
  # queued PR waits forever on a check that is never going to arrive.
  merge_group:
    branches:
      - main
      - 'fold/**'

concurrency:
  # `github.event.pull_request.number` is empty on a merge_group event, so the
  # bare `pr-` group would be shared by every queue entry at once — and with
  # cancel-in-progress each new entry would cancel the one ahead of it. Key the
  # merge_group runs on the queue ref instead, which is unique per entry.
  group: pr-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lockfile_regenerated: ${{ steps.regen_lockfile.outputs.regenerated }}
    # Every diff-based step below needs a base and a head. The `pull_request`
    # payload carries them under `pull_request.*`; the `merge_group` payload
    # uses a different shape, and reading the wrong one yields an empty string
    # that turns `git diff "$BASE...$HEAD"` into a hard error. Resolve both
    # spellings once, here, instead of at nine separate call sites.
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Block manual lockfile edits
        # `refresh-lockfile.yml` names its branch
        # `chore/refresh-lockfile-<sanitized base ref>`, so on any base other
        # than one literally called `chore/refresh-lockfile` the exact-match
        # exemption missed and the bot's own PR was refused by the guard it
        # exists to satisfy. Prefix match instead.
        #
        # Fold branches are exempt for a different reason: a fold does not
        # hand-edit the lockfile, it imports upstream's resolved one wholesale,
        # and that resolution is what upstream tested. Dropping it is not an
        # option either — `Dockerfile` installs `--frozen-lockfile`, so a tree
        # whose manifests name packages its lockfile has never heard of cannot
        # be built at all, and the manual build path in the deploy runbook has
        # no regeneration step to paper over it.
        #
        # Only meaningful for a pull_request. `github.head_ref` is empty on
        # `merge_group`, which voids every `startsWith` exemption above and
        # fails the queue entry for a PR whose own pull_request run passed this
        # same step. The queue is not a place to author a lockfile edit — the
        # PR-event run is where this policy binds.
        if: >-
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'chore/refresh-lockfile') &&
          !startsWith(github.head_ref, 'fold-sync/') &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          # Diff the PR branch against its merge base so recent base-branch commits
          # do not masquerade as changes made by the PR itself.
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if printf '%s\n' "$changed" | grep -qx 'pnpm-lock.yaml'; then
            echo "Do not commit pnpm-lock.yaml in pull requests. CI owns lockfile updates."
            exit 1
          fi

      - name: Reject stale merge base
        # Only meaningful for a pull_request. A merge_group entry is built by
        # GitHub on top of the current base by construction, so there is no
        # stale base to reject — and the age check would misfire on a quiet
        # base branch, failing the queue for a PR that is perfectly current.
        if: github.event_name == 'pull_request'
        run: |
          base_sha="$BASE_SHA"
          head_sha="$HEAD_SHA"
          merge_base=$(git merge-base "$base_sha" "$head_sha")

          # A 0-behind branch is by definition cut at the current base tip:
          # there is nothing to rebase onto and no merged work to revert, so
          # the base branch's own age cannot make the branch stale (SUP-13630).
          # Both rejections therefore require the branch to actually be behind.
          behind=$(git rev-list --count "${merge_base}..${base_sha}")
          base_age_seconds=$(($(date +%s) - $(git log -1 --format=%ct "$merge_base")))

          # Time-based: merge base cut > 24h ago AND the branch is behind
          if [ "$behind" -gt 0 ] && [ "$base_age_seconds" -gt 86400 ]; then
            echo "::error::PR merge base is $((base_age_seconds / 3600))h old (> 24h) and $behind commit(s) behind."
            echo "::error::Stale bases silently revert merged work (SUP-12097). Please rebase onto current fold/tea-patches-v2026.722.0."
            exit 1
          fi

          # Commit-count: merge base > 20 commits behind
          if [ "$behind" -gt 20 ]; then
            echo "::error::PR merge base is $behind commits behind (> 20). Please rebase."
            exit 1
          fi

          echo "Merge base is ${base_age_seconds}s old, $behind commits behind — ok."

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Block overrides change without lockfile update
        # `pnpm.overrides` lives in the root package.json and changes dependency
        # resolution. A PR that edits it without also updating pnpm-lock.yaml
        # merges a base whose committed lockfile no longer matches its manifests,
        # so every later `pnpm install --frozen-lockfile` on the deployed line —
        # and every merge-queue entry — fails with
        # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. The `regen_lockfile` step below would
        # paper over that by regenerating a throwaway artifact for this PR's own
        # checks, leaving the merged base broken. Fail here instead so the author
        # updates the lockfile before merge.
        #
        # Only meaningful for a pull_request: a merge_group entry is built on the
        # current base and its own diff already passed this guard at PR time, so
        # the queue is not a place to author a lockfile edit.
        if: github.event_name == 'pull_request'
        run: node ./scripts/check-overrides-lockfile.mjs

      - name: Validate Dockerfile deps stage
        run: node ./scripts/check-docker-deps-stage.mjs

      - name: Reject git push in adapter/runtime code
        run: node ./scripts/check-no-git-push.mjs

      - name: Test no-git-push check
        run: node --test ./scripts/check-no-git-push.test.mjs

      - name: Test overrides lockfile guard
        run: node --test ./scripts/check-overrides-lockfile.test.mjs

      - name: Test general-server shard partition
        run: node --test ./scripts/__tests__/run-vitest-stable-shard.test.mjs

      - name: Test e2e shard partition
        run: node --test ./scripts/__tests__/e2e-shard.test.mjs

      - name: Test release verify workflow wiring
        run: node --test ./scripts/__tests__/release-verify-workflow.test.mjs

      - name: Test merge queue workflow wiring
        run: node --test ./scripts/__tests__/pr-workflow-merge-group.test.mjs

      - name: Test overrides lockfile guard wiring
        run: node --test ./scripts/__tests__/pr-overrides-guard.test.mjs

      - name: Test standalone package build concurrency
        run: node --test ./scripts/__tests__/build-standalone-concurrency.test.mjs

      - name: Test opencode database janitor
        run: node --test ./scripts/__tests__/opencode-db-janitor.test.mjs

      - name: Test bundled plugin image build coverage
        run: node --test ./scripts/__tests__/build-bundled-plugins.test.mjs

      - name: Test MCP server image build and entrypoint wiring
        run: node --test ./scripts/__tests__/dockerfile-mcp-server-build.test.mjs

      - name: Test agent spawn shim invariants
        run: node --test ./scripts/__tests__/agent-spawn-shim.test.mjs

      - name: Test /app runtime tree ownership invariants
        run: node --test ./scripts/__tests__/dockerfile-app-root-owned.test.mjs

      - name: Test secrets key directory ownership invariants
        run: node --test ./scripts/__tests__/dockerfile-secrets-root-owned.test.mjs

      - name: Test docker image build cache ref casing
        run: node --test ./scripts/__tests__/docker-workflow-cache-refs.test.mjs

      - name: Test lockfile refresh auto-merge gate
        run: node --test ./scripts/__tests__/refresh-lockfile-auto-merge.test.mjs

      - name: Test lockfile refresh PR token wiring
        run: node --test ./scripts/__tests__/refresh-lockfile-pr-token.test.mjs

      - name: Test CI lockfile drift handling
        run: node --test ./scripts/__tests__/ci-lockfile-drift.test.mjs

      - name: Test provisioner instance id canonical form
        run: node --test ./scripts/__tests__/provision-worktree-instance-id.test.mjs

      - name: Test worktree provisioning fallback ladder
        run: node --test ./scripts/__tests__/provision-worktree-self-heal.test.mjs

      - name: Test provisioner instance id reuse
        run: node --test ./scripts/__tests__/provision-worktree-instance-id-reuse.test.mjs

      - name: Validate release package manifest
        run: node ./scripts/release-package-map.mjs check

      - name: Verify release package bootstrap for changed manifests
        run: |
          mapfile -t changed_paths < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          PAPERCLIP_RELEASE_BOOTSTRAP_BASE_SHA="$BASE_SHA" \
            node ./scripts/check-release-package-bootstrap.mjs "${changed_paths[@]}"

      - name: Validate dependency resolution against the committed lockfile
        id: regen_lockfile
        run: |
          # Ask pnpm whether the committed lockfile can satisfy a frozen install of
          # this merge ref's manifests, instead of guessing from the files the PR
          # changed. Manifest edits in the PR (a package.json dependency, a
          # pnpm-workspace.yaml change, or a patch file, whose contents feed the
          # `patchedDependencies` hash) fail this check, and so does drift that
          # arrived on the base branch: a base commit that edits pnpm settings in
          # package.json without refreshing pnpm-lock.yaml made every downstream
          # `pnpm install --frozen-lockfile` fail with
          # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH while the old changed-file heuristic
          # reported nothing to regenerate, so no lockfile was uploaded and every
          # PR touching no manifest was unbuildable until base was refreshed.
          # When the lockfile is already up to date pnpm skips resolution, so the
          # check costs little.
          if pnpm install --lockfile-only --ignore-scripts --frozen-lockfile; then
            echo "regenerated=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          echo "regenerated=1" >> "$GITHUB_OUTPUT"

      # pnpm-lock.yaml always stays at base here, because the policy job above
      # blocks committing it, so whenever the probe had to regenerate one the
      # downstream `pnpm install --frozen-lockfile` steps need that copy. Upload it
      # here so every job consumes the same hash without recomputing.
      - name: Upload regenerated lockfile for downstream jobs
        if: steps.regen_lockfile.outputs.regenerated == '1'
        uses: actions/upload-artifact@v7
        with:
          name: pr-lockfile
          path: pnpm-lock.yaml
          retention-days: 1
          if-no-files-found: error

  typecheck_release_registry:
    name: Typecheck + Release Registry
    needs: [policy]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (when policy regenerated one)
        if: needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v8
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspaces whose build scripts skip TypeScript
        run: pnpm run typecheck:build-gaps

      - name: Verify release registry test coverage
        run: pnpm run test:release-registry

      - name: Verify release source branch gate
        run: pnpm run test:release-source

  general_tests:
    name: General tests (${{ matrix.group_label }})
    needs: [policy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The server suite is pinned to maxWorkers=1 (server/vitest.config.ts),
          # so it can only be parallelized across runners. Shard it to keep this
          # lane off the PR critical path. Five shards because the suite has
          # grown to ~946s of serial vitest wall time (run 30930345729,
          # 2026-08-04): at four shards the worst shard ran 311s and was the
          # slowest check in the whole PR run; five brings each shard to ~196s
          # of suite time (~240s job), level with the other ~250-300s lanes.
          - group: general-server
            group_label: server (1/5)
            shard_index: 0
            shard_count: 5
          - group: general-server
            group_label: server (2/5)
            shard_index: 1
            shard_count: 5
          - group: general-server
            group_label: server (3/5)
            shard_index: 2
            shard_count: 5
          - group: general-server
            group_label: server (4/5)
            shard_index: 3
            shard_count: 5
          - group: general-server
            group_label: server (5/5)
            shard_index: 4
            shard_count: 5
          # workspaces-a was the slowest check in the fully-green PR run
          # 31371439296 (2026-08-10) at 319s, with the ui project's single
          # vitest invocation accounting for ~224s and the paperclipai CLI
          # ~37s. Two shards use Vitest's native --shard on each project's
          # file list (ui: 439 files, cli: 54), bringing each job to roughly
          # half the suite time (~130s + setup) without a duration manifest.
          - group: general-workspaces-a
            group_label: workspaces-a (1/2)
            shard_index: 0
            shard_count: 2
          - group: general-workspaces-a
            group_label: workspaces-a (2/2)
            shard_index: 1
            shard_count: 2
          - group: general-workspaces-b
            group_label: workspaces-b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (when policy regenerated one)
        if: needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v8
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Pre-create secrets key directory
        run: sudo mkdir -p /etc/paperclip/secrets && sudo chown runner:runner /etc/paperclip/secrets

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run grouped general test suites
        run: |
          if [ -n "${{ matrix.shard_count }}" ]; then
            pnpm test:run:general -- --group '${{ matrix.group }}' \
              --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}
          else
            pnpm test:run:general -- --group '${{ matrix.group }}'
          fi

  verify:
    # Preserve the legacy required-check name while the underlying work runs in parallel.
    name: verify
    if: ${{ always() }}
    needs: [typecheck_release_registry, general_tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fail if any split verify lane failed
        env:
          TYPECHECK_RELEASE_REGISTRY_RESULT: ${{ needs.typecheck_release_registry.result }}
          GENERAL_TESTS_RESULT: ${{ needs.general_tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$TYPECHECK_RELEASE_REGISTRY_RESULT" = "success"
          test "$GENERAL_TESTS_RESULT" = "success"
          test "$BUILD_RESULT" = "success"

  build:
    name: Build
    needs: [policy]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (when policy regenerated one)
        if: needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v8
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  verify_serialized_server:
    name: Verify serialized server suites (${{ matrix.shard_label }})
    needs: [policy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # A successful PR run on 2026-08-04 (30876682788) spent 256s in
          # serialized shard 2/4, making its 305s job the run's slowest check.
          # Five shards reduce the measured 739s suite total to about 148s per
          # runner before setup overhead.
          - shard_index: 0
            shard_count: 5
            shard_label: 1/5
          - shard_index: 1
            shard_count: 5
            shard_label: 2/5
          - shard_index: 2
            shard_count: 5
            shard_label: 3/5
          - shard_index: 3
            shard_count: 5
            shard_label: 4/5
          - shard_index: 4
            shard_count: 5
            shard_label: 5/5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (when policy regenerated one)
        if: needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v8
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Pre-create secrets key directory
        # Serialized route suites exercise the real local-encrypted provider,
        # which creates /etc/paperclip/secrets/master.key; the runner user cannot
        # mkdir under /etc, so create it up front like the other test jobs do.
        run: sudo mkdir -p /etc/paperclip/secrets && sudo chown runner:runner /etc/paperclip/secrets

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run serialized server test shard
        run: pnpm test:run:serialized -- --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}

  canary_dry_run:
    name: Canary Dry Run
    needs: [policy]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (when policy regenerated one)
        if: needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v8
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `release.sh` always executes its Step 2/7 workspace build, even when
      # `--skip-verify` bypasses the initial verification gate. release.sh
      # also requires a clean working tree, so any in-place lockfile churn
      # from `pnpm install --frozen-lockfile` must be reverted first — unless
      # the policy job uploaded a regenerated lockfile (manifest-changing
      # PRs), in which case we stage the artifact-restored copy into an
      # ephemeral local commit so release.sh sees a clean tree and its
      # workspace build sees a lockfile that matches the manifest.
      - name: Release canary dry run via release.sh internal build
        env:
          RELEASE_ALLOW_DIVERGENT_SOURCE: "1"
          USED_ARTIFACT_LOCKFILE: ${{ needs.policy.outputs.lockfile_regenerated || '0' }}
        run: |
          if [ "$USED_ARTIFACT_LOCKFILE" = "1" ]; then
            git add pnpm-lock.yaml
            if ! git diff --cached --quiet; then
              git -c user.email=ci@paperclip.local -c user.name=CI \
                commit --no-verify -m "ci(canary): stage regenerated lockfile"
            fi
          else
            git checkout -- pnpm-lock.yaml
          fi
          ./scripts/release.sh canary --skip-verify --dry-run

  e2e_shards:
    name: e2e shard (${{ matrix.shard_label }})
    needs: [policy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Playwright lane is pinned to workers=1 (tests/e2e/playwright.config.ts)
          # because every spec shares one throwaway server and some toggle
          # instance-level flags, so it can only be parallelized across runners.
          # Each shard boots its own server, which keeps that isolation intact.
          # Three shards let the ~3min smoke-lab spec ride alone while the rest
          # of the catalog splits evenly, pulling this lane off the PR critical
          # path (it was the slowest check at ~8min20s with two shards).
          - shard_index: 0
            shard_count: 3
            shard_label: 1/3
          - shard_index: 1
            shard_count: 3
            shard_label: 2/3
          - shard_index: 2
            shard_count: 3
            shard_label: 3/3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (when policy regenerated one)
        if: needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v8
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Pre-create secrets key directory
        # The e2e webServer boots the real server, whose local-encrypted
        # provider creates /etc/paperclip/secrets/master.key. The runner user
        # cannot mkdir under /etc, so create it up front like the general tests
        # job does; without this the webServer dies with
        # "EACCES: permission denied, mkdir '/etc/paperclip/secrets'".
        run: sudo mkdir -p /etc/paperclip/secrets && sudo chown runner:runner /etc/paperclip/secrets

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runner Chrome
        # GitHub's Ubuntu runner image already ships Google Chrome, so use that
        # directly for the headless e2e lane instead of downloading Playwright
        # browser bundles inside the 30 minute job budget.
        run: google-chrome --version

      - name: Generate Paperclip config
        run: |
          mkdir -p ~/.paperclip/instances/default
          cat > ~/.paperclip/instances/default/config.json << 'CONF'
          {
            "$meta": { "version": 1, "updatedAt": "2026-01-01T00:00:00.000Z", "source": "onboard" },
            "database": { "mode": "embedded-postgres" },
            "logging": { "mode": "file" },
            "server": { "deploymentMode": "local_trusted", "host": "127.0.0.1", "port": 3100 },
            "auth": { "baseUrlMode": "auto" },
            "storage": { "provider": "local_disk" },
            "secrets": { "provider": "local_encrypted", "strictMode": false }
          }
          CONF

      - name: Run e2e tests
        env:
          PAPERCLIP_E2E_SKIP_LLM: "true"
          PAPERCLIP_PLAYWRIGHT_CHANNEL: "chrome"
        run: |
          # Playwright's own --shard balances by test count, and one spec
          # (smoke-lab) is ~40% of the lane's wall clock. Partition by recorded
          # spec duration instead so both runners finish together.
          specs="$(node ./scripts/e2e-shard.mjs \
            --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }})"
          echo "shard ${{ matrix.shard_label }} specs: $specs"
          pnpm run test:e2e $specs

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard_index }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14

  e2e:
    # Preserve the legacy required-check name while the specs run sharded
    # across the matrix above (same pattern as the `verify` aggregate).
    name: e2e
    if: ${{ always() }}
    needs: [e2e_shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fail if any e2e shard failed
        env:
          E2E_SHARDS_RESULT: ${{ needs.e2e_shards.result }}
        run: test "$E2E_SHARDS_RESULT" = "success"
