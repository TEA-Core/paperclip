name: commitperclip PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]


# 647 runs over 17 days with no concurrency block at all, so no superseded run
# was ever cancelled. Cancellation is scoped to pull requests; anything else
# gets a unique group keyed on run_id and can never cancel itself.
concurrency:
  group: commitperclip-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Always runs from base branch context — never executes PR code.
# pull_request_target gives access to secrets for untrusted fork PRs.

permissions:
  pull-requests: write
  checks: write
  contents: read
# `security-events: write` is gone with the draft-advisory gate it existed for.
# The diff-based replacement runs in pr.yml's policy job and reports through
# annotations and a job-summary table, so nothing here needs advisory scope.

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout base branch (never PR code)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Generate commitperclip token
        id: token
        run: |
          if [ -n "$TEA_CORE_APP_PRIVATE_KEY" ]; then
            TOKEN=$(node .github/scripts/get-bot-token.mjs)
          else
            # Forks and repos without the app key installed still get the gates:
            # GITHUB_TOKEN already carries pull-requests/checks write here, so
            # comments and check runs land as github-actions[bot] instead of
            # hard-failing the job before any gate runs.
            echo "TEA_CORE_APP_PRIVATE_KEY not configured; falling back to GITHUB_TOKEN." >&2
            TOKEN="$FALLBACK_TOKEN"
          fi
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> $GITHUB_OUTPUT
        env:
          TEA_CORE_APP_PRIVATE_KEY: ${{ secrets.TEA_CORE_APP_PRIVATE_KEY }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run quality gates
        id: quality
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: node .github/scripts/run-quality-gates.mjs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.value }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}

      - name: Fail if quality gates failed
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.quality.outcome == 'failure'
        run: |
          echo "One or more quality gates failed. See commitperclip comment on the PR for details."
          exit 1
