name: Paperclip Approval Enforcer

on:
  # Advisory leg. Green by design (the control plane publishes the status only
  # at review-stage approval, after CI first runs), but never bare green: when
  # `paperclip/approved` is absent on the head the script writes a job summary
  # and a warning annotation naming the head sha and stating the PR will be
  # evicted from the merge queue until the status publishes (SUP-15389).
  pull_request:
    branches:
      - 'fold/**'
  # SUP-12280 phase 2 / SUP-13629: required checks must run for `merge_group`
  # or a queue entry never gets a report on the required context and waits on
  # a check that is never going to arrive. Same branch coverage as
  # `pull_request` above.
  merge_group:
    branches:
      - 'fold/**'
  # The context is safe to require only if the job also reports success (never
  # `skipped`) when the branch is updated by a push — a skipped context never
  # satisfies a required status check (SUP-13500). Kept in its own workflow so
  # a push to the fold does not re-run the heavy pr.yml suite.
  push:
    branches:
      - 'fold/**'

concurrency:
  group: paperclip-approved-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # SUP-13589/SUP-13590/SUP-13629: the approval gate on the fold branch.
  # Consumes the control-plane `paperclip/approved` commit status on the PR
  # head (READ-ONLY — nothing in this repository may create, mock or write
  # that context; see the script header). Advisory on pull_request (the status
  # is published only at review-stage approval, which happens after CI first
  # runs on the PR); fail-closed on merge_group (the last gate before the
  # commit lands on the fold); no-op on push. Runs on all three events and
  # always lands a conclusion — success on the advisory/no-op paths, never
  # skipped.
  paperclip-approved-enforcer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      # `write` (not `read`) so the ejection-surface step can post/update the
      # merge-queue ejection comment on a merge_group failure. It grants comment
      # rights on this job's own PR only — no `checks:read`, no admin
      # escalation. SECURITY (SUP-15375 round 5): because this job carries a
      # write-capable token, it never executes code from the entry's own
      # (PR-controlled) tree. Both control scripts are fetched from the pinned
      # protected BASE SHA via the contents API below.
      pull-requests: write
    env:
      # `gh api` needs a token in the workflow environment — GITHUB_TOKEN is
      # not guaranteed on every runner class; without it every API call fails
      # and the merge_group leg would fail-closed on its own plumbing.
      # `github` context IS valid in a job-level env, but `runner.temp` is not
      # (the runner context is step-level only) — so the verdict file path is
      # declared on the steps that use it below.
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # The BASE commit the entry is built on (protected fold): the gate and the
      # ejection surface are CONTROL code and are always read from here, never
      # from the queued PR's tree.
      MERGE_EJECTION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
    steps:
      - name: Event note
        run: |
          case "${{ github.event_name }}" in
            pull_request) echo "paperclip-approved: pull_request — advisory; the merge queue enforces at the merge boundary; the verdict (present / will-be-evicted) is surfaced as a job summary + warning annotation" ;;
            merge_group)  echo "paperclip-approved: merge_group — enforcing the approval gate" ;;
            *)            echo "paperclip-approved: '${{ github.event_name }}' — no-op, reporting success" ;;
          esac
      - name: Fetch the trusted enforcer script from the base commit
        env:
          # `runner.temp` is only valid at step level; the file is shared with
          # the gate step below via the same path.
          ENFORCER_SCRIPT: ${{ runner.temp }}/check-paperclip-approved.sh
        run: |
          # Round 5 (security): the enforcer gate previously ran
          # `scripts/ci/check-paperclip-approved.sh` from the default checkout —
          # on merge_group that is the gh-readonly-queue ref, i.e. code the
          # queued PR controls. With a write-capable token that lets a queued
          # PR execute arbitrary code (merge-group-comment-token-executes-pr-code).
          # Fetch the reviewed fold copy from the pinned base SHA instead.
          if ! gh api "repos/${GH_REPO}/contents/scripts/ci/check-paperclip-approved.sh?ref=${MERGE_EJECTION_BASE_SHA}" \
              --jq .content 2>/dev/null | base64 -d >"$ENFORCER_SCRIPT" || [ ! -s "$ENFORCER_SCRIPT" ]; then
            echo "paperclip-approved: could not fetch the trusted enforcer script from base ${MERGE_EJECTION_BASE_SHA}" >&2
            # Fail closed: without the reviewed gate script the merge_group leg
            # must not report green.
            exit 1
          fi
      - name: Check the paperclip/approved status
        id: gate
        env:
          # The gate step tees the enforcer's verdict here so the ejection-surface
          # step can quote its reason verbatim. Step-level env (NOT job-level):
          # `runner.temp` is only available in the runner context.
          MERGE_EJECTION_VERDICT: ${{ runner.temp }}/paperclip-approved-verdict
          ENFORCER_SCRIPT: ${{ runner.temp }}/check-paperclip-approved.sh
        run: |
          # Capture the enforcer's verdict so the ejection step can quote its
          # reason verbatim; the job still exits with the enforcer's rc, so the
          # fail-closed merge_group semantics are unchanged.
          set +e
          case "${{ github.event_name }}" in
            pull_request) bash "$ENFORCER_SCRIPT" pull_request "${{ github.event.pull_request.number }}" >"$MERGE_EJECTION_VERDICT" 2>&1 ;;
            merge_group)  bash "$ENFORCER_SCRIPT" merge_group >"$MERGE_EJECTION_VERDICT" 2>&1 ;;
            *)            bash "$ENFORCER_SCRIPT" push >"$MERGE_EJECTION_VERDICT" 2>&1 ;;
          esac
          rc=$?
          set -e
          cat "$MERGE_EJECTION_VERDICT"
          [ "$rc" -eq 0 ] || exit "$rc"
      # SUP-15375: when the gate above fails, the merge queue ejects this entry
      # and the PR head reads identical to a never-queued PR (no comment, no
      # failing check on the head; the merge_group run is on the
      # gh-readonly-queue/… ref agents do not think to query). Surface the
      # reason on the PR so a standard agent token can see it. This runs only
      # when the gate step already failed — it cannot turn a green entry red,
      # and it is best-effort, so a post failure never changes the check
      # conclusion that blocks the merge.
      #
      # The `if` MUST name an explicit status-check function: without one GitHub
      # implicitly prepends `success()`, which is false exactly when the gate
      # step fails — the step would be skipped on the very path it exists for.
      # `failure()` disables that implicit success(), and the `steps.gate.outcome
      # == 'failure'` term keeps it specific to the gate (not a fetch/event step
      # failing earlier).
      #
      # Round 5 (security): the posting implementation is fetched from the
      # pinned protected BASE SHA via the contents API (never from the entry's
      # own tree), executed from $RUNNER_TEMP, and independent of any checkout
      # or ref race. Round 6 (availability): if the trusted helper is not yet
      # on the base (it first ships on the PR that rolls this out), do NOT
      # silently skip the artefact — fall back to the inline trusted
      # find-or-upsert below, which uses the same per-check marker so the two
      # paths update the same comment in place.
      - name: Surface the merge-queue ejection reason on the PR
        if: ${{ failure() && github.event_name == 'merge_group' && steps.gate.outcome == 'failure' }}
        env:
          # Same step-level path as the gate step above (`runner.temp` is
          # constant for the job, so both steps agree on the file).
          MERGE_EJECTION_VERDICT: ${{ runner.temp }}/paperclip-approved-verdict
          MERGE_EJECTION_CHECK_NAME: paperclip-approved-enforcer
        run: |
          surface="${RUNNER_TEMP}/surface-merge-queue-ejection.sh"
          if gh api "repos/${GH_REPO}/contents/scripts/ci/surface-merge-queue-ejection.sh?ref=${MERGE_EJECTION_BASE_SHA}" \
              --jq .content 2>/dev/null | base64 -d >"$surface" 2>/dev/null && [ -s "$surface" ]; then
            bash "$surface" --check-name paperclip-approved-enforcer --verdict "$MERGE_EJECTION_VERDICT"
            exit $?
          fi
          echo "[merge-queue-ejection] trusted surface not on base yet — using the inline fallback poster (best-effort)"
          # --- inline trusted find-or-upsert (no repo file needed) ---
          pr=""
          for ref in "${GITHUB_REF_NAME:-}" "${GITHUB_REF:-}"; do
            [ -n "$ref" ] || continue
            short="${ref#refs/heads/}"
            if [[ "$short" =~ ^gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]+$ ]]; then pr="${BASH_REMATCH[1]}"; break; fi
          done
          if ! [[ "${pr:-}" =~ ^[0-9]+$ ]]; then
            echo "[merge-queue-ejection] could not resolve the PR number — skipping (best-effort); enforcement unaffected"
            exit 0
          fi
          marker="<!-- paperclip:merge-queue-ejection:${MERGE_EJECTION_CHECK_NAME} -->"
          reason="$(tr -d '\r' <"$MERGE_EJECTION_VERDICT" 2>/dev/null | tail -c 4096 | sed -e '/^[[:space:]]*$/d')"
          if [ -z "$reason" ]; then
            reason="(the ${MERGE_EJECTION_CHECK_NAME} check failed on the merge-group commit; see its merge_group run for the full log)"
          fi
          body="$(printf '%s\n## Ejected from the merge queue\n\nThe required **%s** check failed on this entry'"'"'s merge-group commit, so the merge queue removed it.\n\n**Failing check:** %s\n\n**Reason:**\n\n```\n%s\n```\n' \
            "$marker" "$MERGE_EJECTION_CHECK_NAME" "$MERGE_EJECTION_CHECK_NAME" "$reason")"
          existing_id="$(gh api --paginate "repos/${GH_REPO}/issues/${pr}/comments?per_page=100" \
            --jq -r --arg m "paperclip:merge-queue-ejection:${MERGE_EJECTION_CHECK_NAME}" '.[] | select((.body // "") | contains($m)) | .id' 2>/dev/null | head -1 || true)"
          if [ -n "${existing_id:-}" ]; then
            jq -n --arg b "$body" '{body: $b}' \
              | gh api -X PATCH "repos/${GH_REPO}/issues/${pr}/comments/${existing_id}" --input - >/dev/null 2>&1 \
              && echo "[merge-queue-ejection] updated inline ejection comment ${existing_id}" \
              || echo "[merge-queue-ejection] could not update the inline comment — best-effort; enforcement unaffected"
          else
            jq -n --arg b "$body" '{body: $b}' \
              | gh api -X POST "repos/${GH_REPO}/issues/${pr}/comments" --input - >/dev/null 2>&1 \
              && echo "[merge-queue-ejection] posted inline ejection comment" \
              || echo "[merge-queue-ejection] could not post the inline comment — best-effort; enforcement unaffected"
          fi
          exit 0
