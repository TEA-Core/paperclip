name: Paperclip Approval Enforcer

on:
  # Advisory leg. Green by design (the control plane publishes the status only
  # at review-stage approval, after CI first runs), but never bare green: when
  # `paperclip/approved` is absent on the head the script writes a job summary
  # and a warning annotation naming the head sha and stating the PR will be
  # evicted from the merge queue until the status publishes (SUP-15389).
  pull_request:
    branches:
      - 'fold/**'
  # SUP-12280 phase 2 / SUP-13629: required checks must run for `merge_group`
  # or a queue entry never gets a report on the required context and waits on
  # a check that is never going to arrive. Same branch coverage as
  # `pull_request` above.
  merge_group:
    branches:
      - 'fold/**'
  # The context is safe to require only if the job also reports success (never
  # `skipped`) when the branch is updated by a push — a skipped context never
  # satisfies a required status check (SUP-13500). Kept in its own workflow so
  # a push to the fold does not re-run the heavy pr.yml suite.
  push:
    branches:
      - 'fold/**'

concurrency:
  group: paperclip-approved-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # SUP-13589/SUP-13590/SUP-13629: the approval gate on the fold branch.
  # Publishes the required enforcer check by consuming either the normal
  # `paperclip/approved` status or an exact-head, App-issued
  # `release-assurance/approved` GO. No status is written here; the RA control
  # plane remains shadow-only until separately activated. On pull_request
  # the check is advisory; on merge_group it fails closed; push is a no-op.
  # The job always concludes; it is never skipped.
  paperclip-approved-enforcer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The same three read scopes also cover the override-label lookups (issue
    # events, collaborator permission, head-branch activity); see the script
    # header. The override needs no write scope and creates no label.
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    env:
      # `gh api` needs a token in the workflow environment — GITHUB_TOKEN is
      # not guaranteed on every runner class; without it every API call fails
      # and the merge_group leg would fail-closed on its own plumbing.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Event note
        run: |
          case "${{ github.event_name }}" in
            pull_request) echo "paperclip-approved: pull_request — advisory; the merge queue enforces at the merge boundary; the verdict (present / will-be-evicted) is surfaced as a job summary + warning annotation" ;;
            merge_group)  echo "paperclip-approved: merge_group — enforcing the approval gate" ;;
            *)            echo "paperclip-approved: '${{ github.event_name }}' — no-op, reporting success" ;;
          esac
      - uses: actions/checkout@v7
      - name: Check the Paperclip or release-assurance approval status
        env:
          GH_REPO: ${{ github.repository }}
          # SUP-20772: off until the board release route is live. See the
          # script header before turning it on.
          PAPERCLIP_CARD_WAIVER_RETIRED: ${{ vars.PAPERCLIP_CARD_WAIVER_RETIRED }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) bash scripts/ci/check-paperclip-approved.sh pull_request "${{ github.event.pull_request.number }}" ;;
            merge_group)  bash scripts/ci/check-paperclip-approved.sh merge_group ;;
            *)            bash scripts/ci/check-paperclip-approved.sh push ;;
          esac
