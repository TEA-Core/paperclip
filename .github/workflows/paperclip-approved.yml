name: Paperclip Approval Enforcer

on:
  # Advisory leg. Green by design (the control plane publishes the status only
  # at review-stage approval, after CI first runs), but never bare green: when
  # `paperclip/approved` is absent on the head the script writes a job summary
  # and a warning annotation naming the head sha and stating the PR will be
  # evicted from the merge queue until the status publishes (SUP-15389).
  pull_request:
    branches:
      - 'fold/**'
  # SUP-12280 phase 2 / SUP-13629: required checks must run for `merge_group`
  # or a queue entry never gets a report on the required context and waits on
  # a check that is never going to arrive. Same branch coverage as
  # `pull_request` above.
  merge_group:
    branches:
      - 'fold/**'
  # The context is safe to require only if the job also reports success (never
  # `skipped`) when the branch is updated by a push — a skipped context never
  # satisfies a required status check (SUP-13500). Kept in its own workflow so
  # a push to the fold does not re-run the heavy pr.yml suite.
  push:
    branches:
      - 'fold/**'

concurrency:
  group: paperclip-approved-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # SUP-13589/SUP-13590/SUP-13629: the approval gate on the fold branch.
  # Consumes the control-plane `paperclip/approved` commit status on the PR
  # head (READ-ONLY — nothing in this repository may create, mock or write
  # that context; see the script header). Advisory on pull_request (the status
  # is published only at review-stage approval, which happens after CI first
  # runs on the PR); fail-closed on merge_group (the last gate before the
  # commit lands on the fold); no-op on push. Runs on all three events and
  # always lands a conclusion — success on the advisory/no-op paths, never
  # skipped.
  paperclip-approved-enforcer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      # `write` (not `read`) so the ejection-surface step can post/update the
      # merge-queue ejection comment on a merge_group failure. It grants comment
      # rights on this job's own PR only — no `checks:read`, no admin escalation.
      pull-requests: write
    env:
      # `gh api` needs a token in the workflow environment — GITHUB_TOKEN is
      # not guaranteed on every runner class; without it every API call fails
      # and the merge_group leg would fail-closed on its own plumbing.
      # `github` context IS valid in a job-level env, but `runner.temp` is not
      # (the runner context is step-level only) — so the verdict file path is
      # declared on the two steps that use it below.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Event note
        run: |
          case "${{ github.event_name }}" in
            pull_request) echo "paperclip-approved: pull_request — advisory; the merge queue enforces at the merge boundary; the verdict (present / will-be-evicted) is surfaced as a job summary + warning annotation" ;;
            merge_group)  echo "paperclip-approved: merge_group — enforcing the approval gate" ;;
            *)            echo "paperclip-approved: '${{ github.event_name }}' — no-op, reporting success" ;;
          esac
      - uses: actions/checkout@v7
      - name: Check the paperclip/approved status
        id: gate
        env:
          GH_REPO: ${{ github.repository }}
          # The gate step tees the enforcer's verdict here so the ejection-surface
          # step can quote its reason verbatim. Step-level env (NOT job-level):
          # `runner.temp` is only available in the runner context.
          MERGE_EJECTION_VERDICT: ${{ runner.temp }}/paperclip-approved-verdict
        run: |
          # Capture the enforcer's verdict so the ejection step can quote its
          # reason verbatim; the job still exits with the enforcer's rc, so the
          # fail-closed merge_group semantics are unchanged.
          set +e
          case "${{ github.event_name }}" in
            pull_request) bash scripts/ci/check-paperclip-approved.sh pull_request "${{ github.event.pull_request.number }}" >"$MERGE_EJECTION_VERDICT" 2>&1 ;;
            merge_group)  bash scripts/ci/check-paperclip-approved.sh merge_group >"$MERGE_EJECTION_VERDICT" 2>&1 ;;
            *)            bash scripts/ci/check-paperclip-approved.sh push >"$MERGE_EJECTION_VERDICT" 2>&1 ;;
          esac
          rc=$?
          set -e
          cat "$MERGE_EJECTION_VERDICT"
          [ "$rc" -eq 0 ] || exit "$rc"
      # SUP-15375: when the gate above fails, the merge queue ejects this entry
      # and the PR head reads identical to a never-queued PR (no comment, no
      # failing check on the head; the merge_group run is on the
      # gh-readonly-queue/… ref agents do not think to query). Surface the
      # reason on the PR so a standard agent token can see it. This runs only
      # when the gate step already failed — it cannot turn a green entry red,
      # and it is best-effort, so a post failure never changes the check
      # conclusion that blocks the merge.
      #
      # The `if` MUST name an explicit status-check function: without one GitHub
      # implicitly prepends `success()`, which is false exactly when the gate
      # step fails — the step would be skipped on the very path it exists for.
      # `failure()` disables that implicit success(), and the `steps.gate.outcome
      # == 'failure'` term keeps it specific to the gate (not a checkout/event
      # step failing earlier).
      - name: Surface the merge-queue ejection reason on the PR
        if: ${{ failure() && github.event_name == 'merge_group' && steps.gate.outcome == 'failure' }}
        env:
          GH_REPO: ${{ github.repository }}
          # Same step-level path as the gate step above (`runner.temp` is
          # constant for the job, so both steps agree on the file).
          MERGE_EJECTION_VERDICT: ${{ runner.temp }}/paperclip-approved-verdict
        run: |
          bash scripts/ci/surface-merge-queue-ejection.sh --check-name paperclip-approved-enforcer --verdict "$MERGE_EJECTION_VERDICT"
