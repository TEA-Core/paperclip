name: Docker

on:
  push:
    branches:
      # Fold branches publish images too (SUP-12507): the fork deploys from
      # the image a fold-branch merge produces, so a fold push must build.
      - "fold/**"
    tags:
      - "v*"
      - "nightly/v*"
      - "beta/v*"
  # Release workflows push lane tags with GITHUB_TOKEN, and GitHub suppresses
  # push-triggered runs for those, so release.yml dispatches this workflow at
  # the new tag ref instead. The tag mapping below keys off github.ref either
  # way.
  workflow_dispatch:
  # Fork-only: the docker-build-assert job below runs the hardening probes on
  # a PR-built image. Every publishing job carries an explicit
  # `github.event_name != 'pull_request'` guard so a PR never pushes to ghcr.
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/docker.yml"
      # The cache-ref assertion below now reads docker-cloud.yml too (upstream
      # 5c660a32f relocated the cloud build there and took its cache refs with
      # it). Without this path the job would not be scheduled for a PR that
      # touches only that file — i.e. exactly the regression the assertion
      # was widened to catch. The always-run node guard in
      # scripts/__tests__/docker-workflow-cache-refs.test.mjs covers the same
      # invariant without a path filter; this keeps the two in step.
      - ".github/workflows/docker-cloud.yml"
      - "scripts/docker-entrypoint.sh"
      - "scripts/assert-secrets-hardening.sh"

# Least privilege: nothing at the workflow level; each job declares exactly
# the token scopes it uses (checkout needs contents:read, GHCR pushes need
# packages:write).
permissions: {}

# Serialise builds per ref without killing an in-flight one: a newer push
# supersedes only the pending slot, so the image build that is already
# running always finishes and publishes. Canary TAG refs each get their
# own group on purpose: their builds run in parallel so every published
# canary gets its sha images regardless of merge cadence. The mutable
# `:canary` channel tags are NOT written by the build matrix (which
# would race across parallel runs) — each canary-tag run retags the
# channel afterwards, only if it still matches the npm `canary`
# dist-tag, so the channel moves monotonically and always mirrors npm.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Multi-arch by native runner, not QEMU.
  #
  # This was one job building linux/amd64,linux/arm64 together on an x86
  # runner. The arm64 half is emulated there, and it did not merely run slow:
  # it wedged, every time, in `RUN pnpm --filter @paperclipai/server build`,
  # emitting nothing for 38-45 minutes until `timeout-minutes: 60` killed the
  # job. Verified across three consecutive runs on 2026-09-04; the amd64 half
  # reached `production 5/5` minutes earlier in every one.
  #
  # A timed-out job is reported as *cancelled*, not failed, so the run read
  # "cancelled" and the production image simply stopped publishing without
  # anything going red in an obvious way.
  #
  # It also starved the queue. A run that burns the full hour holds the
  # top-level concurrency slot for that hour, and `cancel-in-progress: false`
  # keeps exactly one pending slot — so with merges arriving faster than one
  # an hour, most runs were superseded before they ever started a job. Five of
  # ten master commits sampled that day never produced an image at all.
  #
  # Each platform now builds on a runner of its own architecture and pushes by
  # digest; `merge` assembles the manifest list. arm64 is kept rather than
  # dropped (the cloud variant below dropped it and is amd64-only) because
  # this is the self-hosted image, and ARM hosts consume it.
  build-and-push:
    if: github.event_name != 'pull_request'
    strategy:
      # Independent legs: one architecture failing should still publish
      # nothing, but it must not also hide the other's logs behind a
      # cancellation.
      fail-fast: false
      matrix:
        # arm64 is built for RELEASE TAGS ONLY (fork decision, #295 / plan
        # CI-COST item 6 / spec SS5.1 lever 4). Upstream's move to native
        # per-arch runners removes the ~26m QEMU penalty that first motivated
        # the lever, but two things keep it: branch pushes (112 runs/17d on
        # the fork, now including every `fold/**` push) have never needed an
        # arm64 artifact, and `ubuntu-24.04-arm` is a hosted label this fork
        # has not yet exercised — a missing runner on a non-tag push would
        # fail the leg, skip `merge-and-push` through `needs:`, and stop
        # publishing the image the fork deploys from. Releases keep multi-arch
        # so any arm64 consumer of a tagged image is unaffected.
        #
        # Do NOT "fix" the remaining tag-path exposure by sending the arm64
        # leg back to `ubuntu-latest`: the header comment above records that
        # the emulated arm64 half wedged in `pnpm --filter @paperclipai/server
        # build` on EVERY one of three consecutive runs (2026-09-04) until the
        # 60-minute cap killed the job, and a timed-out job reports as
        # *cancelled*, so that path blocks the release silently. An
        # unavailable runner label fails the leg immediately and loudly
        # instead. Nor gate arm64 behind an opt-in variable: that publishes
        # amd64-only release images under the same tags, which is the silent
        # loss this lever exists to avoid. If the `ubuntu-24.04-arm` label
        # turns out to be unavailable to this fork, the fix is to obtain it
        # (or drop arm64 from releases deliberately, updating this comment),
        # not to re-emulate.
        include: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && '[{"platform":"linux/amd64","runner":"ubuntu-latest","arch":"amd64"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","arch":"arm64"}]' || '[{"platform":"linux/amd64","runner":"ubuntu-latest","arch":"amd64"}]') }}
    runs-on: ${{ matrix.runner }}
    # Native builds land well inside this; it is a backstop, not a budget.
    # (The interim fix while this PR landed raised the single QEMU job's cap
    # to 120 minutes; native per-arch legs make that headroom unnecessary.)
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and tags so `git describe` below can compute the
          # release version to stamp into the image.
          fetch-depth: 0

      # `github.repository` expands to mixed-case (e.g. `TEA-Core/paperclip`).
      # `docker/metadata-action` lowercases its `images:` input automatically,
      # but the buildx registry cache refs and the push-by-digest `outputs:`
      # name are passed straight through to BuildKit, which rejects uppercase.
      # Compute the lowercase slug once and reference it in every raw ref
      # below (SUP-12959).
      - name: Compute lowercase repository slug
        run: echo "REPO_SLUG=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # `.git` is dockerignored, so a running image cannot derive its own
      # version and otherwise reports the source package.json placeholder in
      # analytics and the debug panel. Compute it here from the pristine
      # checkout (real CalVer drift from the nearest release tag) and pass it
      # into both builds. Empty when no release tag is reachable — the server
      # then keeps its existing fallbacks.
      - name: Compute build version
        id: build-version
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/nightly/v*)
              # Lane tags carry the exact published version; stamp it verbatim
              # instead of describing drift from the nearest stable tag.
              version="${GITHUB_REF#refs/tags/nightly/v}"
              ;;
            refs/tags/beta/v*)
              version="${GITHUB_REF#refs/tags/beta/v}"
              ;;
            *)
              version="$(git describe --tags --match 'v*' --long --dirty 2>/dev/null || true)"
              ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Stamping build version: ${version:-<none>}"

      # ISO week stamp for the Dockerfile's tool layer: the layer caches
      # across commits and re-pulls the @latest CLI tools when the week rolls
      # over, instead of on every build.
      - name: Compute tool cache epoch
        id: tools-epoch
        run: echo "epoch=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      # No dependency cache here: this workflow publishes release images, and
      # restoring a shared Actions cache into the build inputs would let a
      # poisoned cache entry reach the published artifact.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Refresh lockfile for Docker build context
        run: |
          set -euo pipefail
          pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile

          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lockfile already matches package metadata."
            exit 0
          fi

          if printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"
            echo "$changed"
            exit 1
          fi

          echo "Using refreshed pnpm-lock.yaml in the Docker build context."

      - name: Free runner disk
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h

          pnpm store prune || true
          sudo apt-get clean || true
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby || true
          docker system prune -af || true

          echo "Disk after cleanup:"
          df -h

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Deployment tooling reads these labels from the registry to verify an
      # image's schema expectations against a migrator before deploying it,
      # without pulling the image. The server refuses to start when the
      # database is missing bundled migrations, so orchestrators need a cheap
      # way to check image/migrator compatibility up front.
      - name: Compute schema migration labels
        id: schema
        run: |
          set -euo pipefail
          last=$(ls packages/db/src/migrations/*.sql | sed 's|.*/||' | LC_ALL=C sort | tail -1)
          count=$(ls packages/db/src/migrations/*.sql | wc -l | tr -d ' ')
          echo "last=${last}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      # Lane tag mapping: nightly/v* tags publish `:nightly`, and only
      # stable v* tags move `:latest` and the versioned tags.
      # `:sha-<short>` is published on every build. `:canary` is
      # deliberately absent here — the channel tag is moved by the
      # dist-tag-checked retag step below, never by the build matrix,
      # so parallel canary builds cannot race it backwards.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=nightly,enable=${{ startsWith(github.ref, 'refs/tags/nightly/v') }}
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/beta/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
          labels: |
            io.github.paperclipai.schema.last-migration=${{ steps.schema.outputs.last }}
            io.github.paperclipai.schema.migration-count=${{ steps.schema.outputs.count }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # Pin the self-hosted image to the production stage explicitly:
          # the Dockerfile now declares a later `cloud` stage, and without a
          # target the default would silently become that stage.
          target: production
          build-args: |
            PAPERCLIP_BUILD_VERSION=${{ steps.build-version.outputs.version }}
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
            CLI_TOOLS_CACHE_EPOCH=${{ steps.tools-epoch.outputs.epoch }}
          platforms: ${{ matrix.platform }}
          # By digest, not by tag: two runners cannot each push the same tag
          # and end up with a manifest list. Each leg publishes an untagged
          # image and `merge` names them together.
          outputs: type=image,name=ghcr.io/${{ env.REPO_SLUG }},push-by-digest=true,name-canonical=true,push=true
          # Registry-backed BuildKit cache instead of type=gha: the Actions
          # cache is capped at 10GB per repo, and two multi-arch mode=max jobs
          # evict each other, so most builds ran effectively cold. The cache
          # ref lives in ghcr next to the image and is written only by this
          # workflow (docker.yml runs on master/tag pushes, never on PRs).
          #
          # Per-arch refs now the legs are separate runners: a shared ref would
          # have each leg overwrite the other's cache on every build.
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_SLUG }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_SLUG }}:buildcache-${{ matrix.arch }},mode=max
          labels: ${{ steps.meta.outputs.labels }}

      # The digest is the only thing `merge` needs from this job. Carried as an
      # empty file named for it, which is the upstream pattern — the name is
      # the payload, so several legs can upload without colliding on content.
      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-production-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Names the per-architecture digests as one manifest list under the real
  # tags. Nothing is publicly tagged until this runs, so a half-published
  # multi-arch image is not a state anything can pull.
  merge-and-push:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      # Checked out for `packages/db` (schema labels) and the orphan-reaping
      # script the verification step pipes in.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Same lowercase slug as the build legs (SUP-12959): `imagetools create`
      # takes the repository name raw and rejects uppercase.
      - name: Compute lowercase repository slug
        run: echo "REPO_SLUG=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-production-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Repeated from the build job rather than passed between them: job
      # outputs would have to survive a matrix, and this is two `ls` calls.
      - name: Compute schema migration labels
        id: schema
        run: |
          set -euo pipefail
          last=$(ls packages/db/src/migrations/*.sql | sed 's|.*/||' | LC_ALL=C sort | tail -1)
          count=$(ls packages/db/src/migrations/*.sql | wc -l | tr -d ' ')
          echo "last=${last}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      # Same lane mapping as the build job; this is where it is actually
      # applied, since the legs push untagged. `:canary` is deliberately
      # absent, exactly as in the build job's mapping: the channel tag is
      # moved only by the dist-tag-checked promote_canary_channel job below,
      # so parallel canary-tag builds can never race the channel backwards.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=nightly,enable=${{ startsWith(github.ref, 'refs/tags/nightly/v') }}
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/beta/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
          labels: |
            io.github.paperclipai.schema.last-migration=${{ steps.schema.outputs.last }}
            io.github.paperclipai.schema.migration-count=${{ steps.schema.outputs.count }}

      # `imagetools create` consumes only `.tags` from the metadata output —
      # the `labels:` above are already baked into each per-arch child config
      # by the build legs, and are NOT re-applied to the manifest the tag
      # points at. That matters for the fork's deploy preflight, which reads
      # `io.github.paperclipai.schema.*` from the registry: before upstream
      # split the build into per-arch legs, a branch/fold push published an
      # amd64-only image whose tag resolved straight to a config carrying the
      # labels. `--prefer-index=false` restores exactly that shape — with a
      # single source manifest the tag is copied as-is instead of being
      # wrapped in a one-child index (the same flag the cloud workflow uses
      # for its single-arch publish). On multi-arch release tags the tag is
      # still an index and the labels live on the child configs, as they did
      # before this split; a preflight that must read them there has to
      # resolve a child (`imagetools inspect --format '{{json .Image}}'`,
      # `crane config`, or a plain `docker pull` + `docker image inspect`).
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ env.REPO_SLUG }}@sha256:%s ' *)

      # PID 1 must be an init that reaps adopted orphans. With node there, the
      # orphans agent runs leave behind are never wait()ed and pin as zombies
      # until the cgroup pid limit is exhausted and every fork() in the
      # container fails. Run against the pushed manifest rather than a local
      # build: the legs push by digest, so nothing is loaded into this
      # runner's daemon. The independent cloud workflow checks its own image.
      - name: Verify PID 1 reaps orphaned processes
        env:
          # Through the environment, not interpolated into the script body, so
          # the tag text is data rather than shell.
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          test -n "$image"
          echo "Verifying orphan reaping in $image"
          docker run --rm -i --pull always "$image" sh -s < scripts/assert-orphan-reaping.sh

  # Master cloud builds start independently in docker-cloud.yml. Tag builds
  # and manual Docker dispatches call the same implementation, preserving the
  # release tags and the canary promotion dependency below.
  build-and-push-cloud:
    # Upstream's guard (master pushes build cloud independently in
    # docker-cloud.yml) AND the fork's PR guard: without the second half the
    # `pull_request` trigger above would publish a cloud image from a PR.
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref != 'refs/heads/master')
    uses: ./.github/workflows/docker-cloud.yml
    permissions:
      contents: read
      packages: write

  # Moves the mutable `:canary` / `:canary-cloud` channel tags. Kept OUT
  # of the build jobs and serialized in its own lane, and — the load-
  # bearing property — CONVERGENT rather than self-interested: a
  # promotion does not promote "its own" canary, it retags the channel
  # to whatever the npm `canary` dist-tag names at execution time,
  # provided that version's sha images are published. GitHub's shared
  # concurrency lane keeps one running and one pending promotion and
  # REPLACES the pending slot with the latest enqueued — an older build
  # finishing late can therefore evict the newest canary's pending
  # promotion. With convergent promotion that eviction is harmless:
  # whichever promotion survives resolves the current dist-tag fresh
  # and lands the channel there (the current canary's images always
  # exist by the time any later promotion runs, because per-tag build
  # groups mean canary builds are never superseded and each run's
  # promotion is gated on its own completed pushes). Every interleaving
  # converges the Docker channel onto the npm channel.
  promote_canary_channel:
    if: startsWith(github.ref, 'refs/tags/canary/v')
    # merge-and-push, not build-and-push: the per-arch legs push untagged
    # digests, and the production `sha-*` tags this promotion retags only
    # exist once the manifest merge has named them.
    needs: [merge-and-push, build-and-push-cloud]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-canary-channel-promotion
      cancel-in-progress: false
    steps:
      # Same lowercase slug as the build legs (SUP-12959): `imagetools` takes
      # the repository name raw and rejects uppercase.
      - name: Compute lowercase repository slug
        run: echo "REPO_SLUG=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Converge the channel tags onto the current npm canary
        env:
          IMAGE: ghcr.io/${{ env.REPO_SLUG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(curl -fsS "https://registry.npmjs.org/-/package/@paperclipai%2Fdb/dist-tags" | jq -er .canary)"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/$(printf 'canary/v%s' "$current" | jq -sRr @uri)" --jq .sha 2>/dev/null || true)"
          if [ -z "$sha" ]; then
            echo "canary/v${current} does not resolve yet; a later promotion converges the channel"
            exit 0
          fi
          short="$(printf '%s' "$sha" | cut -c1-7)"
          if ! docker buildx imagetools inspect "$IMAGE:sha-${short}-cloud" >/dev/null 2>&1; then
            echo "images for ${current} (sha-${short}) not published yet; its own promotion converges the channel"
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE:canary" "$IMAGE:sha-${short}"
          docker buildx imagetools create -t "$IMAGE:canary-cloud" "$IMAGE:sha-${short}-cloud"
          echo "channel tags moved to canary ${current} (sha-${short})"

  docker-build-assert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'pull_request'
    # Top-level permissions are now `{}` (upstream least-privilege); this job
    # only checks out and builds locally, so contents:read is all it needs.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Regression guard: the buildx registry cache refs must use the lowercase
      # slug, never the raw mixed-case `${{ github.repository }}`. Re-introducing
      # the raw expression in a cache-from/cache-to value reproduces the
      # `invalid reference format ... must be lowercase` failure.
      - name: Assert cache refs use lowercase slug
        run: |
          set -euo pipefail
          # Both workflows: upstream moved the cloud build into
          # .github/workflows/docker-cloud.yml, which took its cache refs with
          # it, so guarding docker.yml alone no longer covers the regression.
          #
          # Matching `cache-from:`/`cache-to:` alone is not enough: the cloud
          # job builds its cache-FROM list indirectly, from a `CACHE_IMAGE:`
          # env var expanded into `type=registry,ref=...` lines by a shell
          # step, and BuildKit rejects an uppercase reference on IMPORT as
          # well as export. Match the ref-bearing constructs instead of the
          # YAML key. `images:` lines are deliberately not matched:
          # `docker/metadata-action` lowercases its `images:` input itself.
          bad="$(grep -nE '(cache-(from|to):|CACHE_IMAGE:|type=registry,ref=|push-by-digest|imagetools).*github\.repository' \
            .github/workflows/docker.yml .github/workflows/docker-cloud.yml || true)"
          if [ -n "$bad" ]; then
            echo "FAIL: raw \${{ github.repository }} found in registry ref(s):"
            echo "$bad"
            exit 1
          fi
          echo "PASS: no raw \${{ github.repository }} in registry refs"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The image runs `pnpm install --frozen-lockfile` in its deps stage, so it
      # needs the same refreshed lockfile the publishing jobs above build with.
      # Without this the assert job died in the deps stage with
      # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH whenever the committed lockfile lagged
      # the manifests, before any hardening assertion below could run.
      - name: Refresh lockfile for Docker build context
        run: |
          set -euo pipefail
          # --resolution-only, not --lockfile-only: the metadata-only flag does
          # not resolve dependencies, so the refreshed lockfile could still fail
          # the image's `pnpm install --frozen-lockfile`. This also matches the
          # publishing jobs above and the invariant
          # .github/scripts/tests/lockfile-refresh-workflows.test.mjs asserts
          # over this file — which this job's `--lockfile-only` had been failing
          # since the job was added, before this fold.
          pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile

          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lockfile already matches package metadata."
            exit 0
          fi

          if printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"
            echo "$changed"
            exit 1
          fi

          echo "Using refreshed pnpm-lock.yaml in the Docker build context."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image (no push)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: paperclip:pr
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert /app is root-owned
        run: |
          docker run --rm paperclip:pr sh -c 'ls -ld /app/packages /app/server'

      - name: Assert uid-1000 cannot write to /app (EACCES)
        run: |
          set +e
          docker run --rm -u 1000:1000 paperclip:pr sh -c 'touch /app/packages/adapter-utils/src/acpx-engine/.probe' > /tmp/touch-out.txt 2>&1
          touch_rc=$?
          if [ "$touch_rc" -eq 0 ]; then
            echo "FAIL: touch succeeded (uid 1000 was able to write to /app)"
            cat /tmp/touch-out.txt
            exit 1
          fi
          echo "PASS: touch failed with exit code $touch_rc (EACCES as expected)"
          cat /tmp/touch-out.txt

      - name: Assert uid-1000 cannot overwrite executed source (EACCES)
        run: |
          set +e
          docker run --rm -u 1000:1000 paperclip:pr sh -c 'echo x > /app/packages/adapter-utils/src/acpx-engine/execute.ts' > /tmp/overwrite-out.txt 2>&1
          overwrite_rc=$?
          if [ "$overwrite_rc" -eq 0 ]; then
            echo "FAIL: overwrite succeeded (uid 1000 was able to write to /app)"
            cat /tmp/overwrite-out.txt
            exit 1
          fi
          echo "PASS: overwrite failed with exit code $overwrite_rc (EACCES as expected)"
          cat /tmp/overwrite-out.txt

      - name: Assert server can still read+execute /app under uid 1000
        run: |
          docker run --rm -u 1000:1000 paperclip:pr node --import ./server/node_modules/tsx/dist/loader.mjs -e 'console.log("tsx-loader-ok")'

      # Read-only is not enough: hardening that strips executable bits leaves an
      # image that boots and then fails with EACCES the first time the tsx
      # loader shells out to esbuild, or an agent runs a bundled skill helper.
      - name: Assert executable bits survived hardening (tsx transform + skill helper)
        run: |
          docker run --rm -u 1000:1000 paperclip:pr sh -c '
            set -e
            printf "const msg: string = \"tsx-transform-ok\";\nconsole.log(msg);\n" > /tmp/probe.ts
            node --import /app/server/node_modules/tsx/dist/loader.mjs /tmp/probe.ts
            test -x /app/skills/paperclip/scripts/paperclip-upload-artifact.sh \
              || { echo "FAIL: bundled skill helper lost its executable bit"; exit 1; }
            echo "PASS: executable bits preserved under /app"
          '

      - name: Assert /etc/paperclip/secrets is root-owned
        run: |
          docker run --rm paperclip:pr sh -c '
            set -e
            ls -ld /etc/paperclip/secrets
            [ "$(stat -c "%U:%G %a" /etc/paperclip/secrets)" = "root:root 700" ] || { echo "FAIL: /etc/paperclip/secrets is $(stat -c "%U:%G %a" /etc/paperclip/secrets), want root:root 700"; exit 1; }
            echo "PASS: /etc/paperclip/secrets is root:root 0700"
          '

      # The secrets probes deliberately do NOT use `-u 1000:1000`: with a non-root
      # uid the entrypoint takes its unprivileged branch, never creates
      # /etc/paperclip/secrets, and the probes then measure ENOENT instead of
      # EACCES — `touch` "passes" for the wrong reason and `rm -f` on a missing
      # path exits 0, failing the step on a container that was never hardened.
      # scripts/assert-secrets-hardening.sh instead runs one container that starts
      # as root, seeds the pre-fix node-owned state, hands over to the real
      # entrypoint, and probes read/list/write/unlink plus the env handoff from
      # uid 1000 after the gosu drop.
      - name: Assert entrypoint hardens secrets against uid 1000 (EACCES + key handoff)
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            -e EXPECTED_KEY=ci-assert-master-key \
            -v "$PWD/scripts/assert-secrets-hardening.sh:/probe.sh:ro" \
            paperclip:pr /probe.sh
