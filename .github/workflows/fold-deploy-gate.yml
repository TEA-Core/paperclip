name: Fold buildability gate

# TEA-Core fork only.
#
# NOTICE (SUP-14706): this workflow does NOT deploy. It does not build an
# image for the plane, does not publish one, and does not roll the running
# container. A green run here only proves the merged branch is buildable.
# It was renamed from "Fold deploy gate" because that name read like a deploy.
# The real fold-merge-to-running-container path is operator-pressed; see
# docs/deploy/control-plane-rollout.md for the runbook and liveness check.
#
# `pr.yml` gates pull requests. This gates the *merged* state of the deployed
# line, which is a different failure mode and the one that actually bit us:
# on 2026-08-10 the fold branch sat merged and unable to compile for two days
# while every PR page showed green, because the only checks running were AI
# reviewers. The break was found by hand, during a pre-deploy spot check.
#
# Deliberately narrow and fast. It runs the things that decide whether the
# branch can ship at all:
#
#   1. `pnpm run typecheck` across the workspace
#   2. `pnpm --filter @paperclipai/server build` — the exact command the
#      Dockerfile runs, so a red build here means `docker build` cannot succeed
#   3. `docker build` — the full image build, including the build-time JSON-RPC
#      handshake that proves the MCP server binary starts, resolves its
#      dependencies, and registers the WorkSession tools. This is the only
#      verification that the handshake actually executes; the string-level test
#      in pr.yml passes whether or not the layers work.
#
# Tests are pr.yml's job. Keeping this lane quick means it is still useful as a
# branch-health signal rather than something people learn to ignore.

on:
  push:
    branches:
      - 'fold/**'
  workflow_dispatch:

concurrency:
  group: fold-buildability-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildable:
    name: Branch is buildable
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Deliberately `--frozen-lockfile`, matching the Dockerfile. A lockfile that
      # has drifted from the manifests (most often a changed file under patches/,
      # whose hash the lockfile records) fails here — and would fail the image
      # build for the same reason. `pr.yml` cannot catch this: it regenerates the
      # lockfile into a throwaway artifact, and its policy job blocks committing
      # one, so drift only becomes visible once the branch is merged.
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        run: pnpm run typecheck

      # Not redundant with the typecheck above: this is the literal Dockerfile
      # layer. If it fails, no deployable image can be produced from this commit.
      - name: Server build (the Dockerfile layer)
        id: build
        run: pnpm --filter @paperclipai/server build

      # The full image build. This is the only gate that runs the Dockerfile's
      # build-time JSON-RPC handshake, which proves the MCP server binary starts,
      # resolves its dependencies, and registers paperclipOpenWorkSession. Without
      # this step, a broken dependency tree or missing tool ships silently — the
      # string-level test in pr.yml asserts the handshake text is present but
      # passes whether or not the layers actually work.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker image build (runs the MCP handshake)
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: paperclip:fold-deploy-gate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report — lockfile
        if: failure() && steps.install.outcome == 'failure'
        run: |
          echo "::error::pnpm install --frozen-lockfile failed on the deployed branch."
          echo "::error::The Dockerfile runs this same command, so docker build cannot succeed from this commit."
          echo "::error::Usually a changed file under patches/ without a matching pnpm-lock.yaml update."
          echo "::error::Fix: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile, then commit pnpm-lock.yaml."

      - name: Report — typecheck
        if: failure() && steps.typecheck.outcome == 'failure'
        run: echo "::error::The deployed fold branch does not typecheck."

      - name: Report — build
        if: failure() && steps.build.outcome == 'failure'
        run: |
          echo "::error::The deployed fold branch does not build."
          echo "::error::docker build will fail at 'pnpm --filter @paperclipai/server build'."
          echo "::error::Do not cut a release image from this commit."

      - name: Report — docker build
        if: failure() && steps.docker-build.outcome == 'failure'
        run: |
          echo "::error::docker build failed on the deployed fold branch."
          echo "::error::This is the only gate that runs the build-time JSON-RPC handshake."
          echo "::error::The MCP server binary did not start, did not resolve its dependencies,"
          echo "::error::or did not register paperclipOpenWorkSession."
          echo "::error::Do not cut a release image from this commit."
