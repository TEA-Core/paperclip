name: Refresh Lockfile

on:
  push:
    branches:
      - master
      - "fold/**"
  workflow_dispatch:

concurrency:
  group: refresh-lockfile-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Resolution-only installs do not populate the package store. Do not
          # claim the shared cache key with an empty archive before full installs.
          package-manager-cache: false

      - name: Refresh pnpm lockfile
        run: pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile

      - name: Fail on unexpected file changes
        run: |
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"
            echo "$changed"
            exit 1
          fi

      - name: Generate commitperclip token
        id: bot-token
        env:
          TEA_CORE_APP_PRIVATE_KEY: ${{ secrets.TEA_CORE_APP_PRIVATE_KEY }}
        run: |
          TOKEN=""
          if [ -n "$TEA_CORE_APP_PRIVATE_KEY" ]; then
            if ! TOKEN="$(node .github/scripts/get-bot-token.mjs)"; then
              echo "::warning::Failed to generate the commitperclip bot token; PR creation will be skipped."
              TOKEN=""
            fi
          fi
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        id: upsert-pr
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged, nothing to do."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_REF="${GITHUB_REF_NAME}"
          # Sanitize the base ref for use in a branch name (replace slashes with hyphens).
          SANITIZED_BASE="$(echo "$BASE_REF" | tr '/' '-')"
          BRANCH="chore/refresh-lockfile-${SANITIZED_BASE}"
          git config user.name "lockfile-bot"
          git config user.email "lockfile-bot@users.noreply.github.com"

          PR_BODY=$(cat <<EOF
## Thinking Path

> - Paperclip is the open source app people use to manage AI agents for work.
> - The Refresh Lockfile workflow keeps dependency lockfiles aligned with patch changes.
> - This generated pull request carries the lockfile update for the target branch.

## Linked Issues or Issue Description

This is an automated lockfile refresh. It changes only pnpm-lock.yaml after dependencies changed on the target branch.

## What Changed

- Refreshed pnpm-lock.yaml.

## Verification

- The workflow checks that no unexpected files changed.

## Risks

Low risk. This pull request contains only generated lockfile metadata.

## Model Used

None — workflow-generated.

Paperclip-Approved-Waiver: automated lockfile refresh, no Paperclip card (SUP-13629)
EOF
)

          # The exact command a human runs to open the PR by hand. Emitted in the
          # ::error:: remediation below so the pushed branch is never left unpointed.
          PR_CMD="gh pr create --head \"${BRANCH}\" --base \"${BASE_REF}\" --title \"chore(lockfile): refresh pnpm-lock.yaml for ${BASE_REF}\" --body \"${PR_BODY}\""

          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Lockfile push not performed::No bot token (TEA_CORE_APP_PRIVATE_KEY) is available, so the branch update was NOT pushed: a push we could not bind to the app installation token would create runs held at action_required. Generate the token, push, and open the PR manually: ${PR_CMD}" >&2
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          PUSH_CREDENTIAL_HELPER="$(mktemp)"
          trap 'rm -f "$PUSH_CREDENTIAL_HELPER"' EXIT
          printf '#!/bin/sh\nprintf "username=x-access-token\\npassword=%%s\\n" "$GH_TOKEN"\n' > "$PUSH_CREDENTIAL_HELPER"
          chmod 700 "$PUSH_CREDENTIAL_HELPER"
          git checkout -B "$BRANCH"
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): refresh pnpm-lock.yaml for ${BASE_REF}"
          git -c credential.helper="!$PUSH_CREDENTIAL_HELPER" push --force origin "$BRANCH"

          # Only reuse an open PR from this repository owner, not a fork with the same branch name.
          pr_url="$(
            gh pr list --state open --head "$BRANCH" --json url,headRepositoryOwner \
              --jq ".[] | select(.headRepositoryOwner.login == \"$REPO_OWNER\") | .url" |
            head -n 1
          )"
          if [ -z "$pr_url" ]; then
            if ! gh pr create \
              --head "$BRANCH" \
              --base "$BASE_REF" \
              --title "chore(lockfile): refresh pnpm-lock.yaml for ${BASE_REF}" \
              --body "$PR_BODY" > "$RUNNER_TEMP/pr-create.out"; then
              echo "::error title=Lockfile PR not created::Failed to open a PR for pushed branch '${BRANCH}'. Open it manually with: ${PR_CMD}"
              echo "pr_url=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            pr_url="$(cat "$RUNNER_TEMP/pr-create.out")"
            echo "Created new PR: $pr_url"
          else
            echo "PR already exists: $pr_url"
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for lockfile PR
        # The fold branch is the deployed line, so its regenerated lockfile must
        # land without a manual merge too; otherwise the PR sits open and the
        # branch becomes unbuildable (`Dockerfile` installs --frozen-lockfile).
        if: >-
          steps.upsert-pr.outputs.pr_url != '' &&
          (github.ref_name == 'master' || startsWith(github.ref_name, 'fold/'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No --delete-branch: rejected when the target branch has a merge queue
          # enabled ("Cannot use -d or --delete-branch when merge queue enabled").
          # gh requires an explicit method in non-interactive runners. The fold
          # queue uses squash, so keep the requested method aligned with it.
          gh pr merge --auto --squash "${{ steps.upsert-pr.outputs.pr_url }}"
