name: Refresh Lockfile

on:
  push:
    branches:
      - master
      - "fold/**"
  workflow_dispatch:

concurrency:
  group: refresh-lockfile-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Refresh pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Fail on unexpected file changes
        run: |
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"
            echo "$changed"
            exit 1
          fi

      - name: Generate commitperclip token
        id: bot-token
        env:
          TEA_CORE_APP_PRIVATE_KEY: ${{ secrets.TEA_CORE_APP_PRIVATE_KEY }}
        run: |
          TOKEN=""
          if [ -n "$TEA_CORE_APP_PRIVATE_KEY" ]; then
            if ! TOKEN="$(node .github/scripts/get-bot-token.mjs)"; then
              echo "::warning::Failed to generate the commitperclip bot token; PR creation will be skipped."
              TOKEN=""
            fi
          fi
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        id: upsert-pr
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged, nothing to do."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_REF="${GITHUB_REF_NAME}"
          # Sanitize the base ref for use in a branch name (replace slashes with hyphens).
          SANITIZED_BASE="$(echo "$BASE_REF" | tr '/' '-')"
          BRANCH="chore/refresh-lockfile-${SANITIZED_BASE}"
          git config user.name "lockfile-bot"
          git config user.email "lockfile-bot@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): refresh pnpm-lock.yaml for ${BASE_REF}"
          git push --force origin "$BRANCH"

          # The exact command a human runs to open the PR by hand. Emitted in the
          # ::error:: remediation below so the pushed branch is never left unpointed.
          PR_CMD="gh pr create --head \"${BRANCH}\" --base \"${BASE_REF}\" --title \"chore(lockfile): refresh pnpm-lock.yaml for ${BASE_REF}\" --body \"Auto-generated lockfile refresh after dependencies changed on ${BASE_REF}. This PR only updates pnpm-lock.yaml.\""

          # The default GITHUB_TOKEN cannot create PRs in this org ("GitHub Actions
          # is not permitted to create or approve pull requests"), so the bot token
          # (commitperclip app installation) is required. Fail loudly rather than
          # leaving an orphan branch with no pointer.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Lockfile PR not created::No bot token (TEA_CORE_APP_PRIVATE_KEY) is available to open the PR. The refreshed lockfile was pushed to branch '${BRANCH}' but no PR was created. Open it manually with: ${PR_CMD}"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only reuse an open PR from this repository owner, not a fork with the same branch name.
          pr_url="$(
            gh pr list --state open --head "$BRANCH" --json url,headRepositoryOwner \
              --jq ".[] | select(.headRepositoryOwner.login == \"$REPO_OWNER\") | .url" |
            head -n 1
          )"
          if [ -z "$pr_url" ]; then
            if ! gh pr create \
              --head "$BRANCH" \
              --base "$BASE_REF" \
              --title "chore(lockfile): refresh pnpm-lock.yaml for ${BASE_REF}" \
              --body "Auto-generated lockfile refresh after dependencies changed on ${BASE_REF}. This PR only updates pnpm-lock.yaml." > "$RUNNER_TEMP/pr-create.out"; then
              echo "::error title=Lockfile PR not created::Failed to open a PR for pushed branch '${BRANCH}'. Open it manually with: ${PR_CMD}"
              echo "pr_url=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            pr_url="$(cat "$RUNNER_TEMP/pr-create.out")"
            echo "Created new PR: $pr_url"
          else
            echo "PR already exists: $pr_url"
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for lockfile PR
        # The fold branch is the deployed line, so its regenerated lockfile must
        # land without a manual merge too; otherwise the PR sits open and the
        # branch becomes unbuildable (`Dockerfile` installs --frozen-lockfile).
        if: >-
          steps.upsert-pr.outputs.pr_url != '' &&
          (github.ref_name == 'master' || startsWith(github.ref_name, 'fold/'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --auto --squash --delete-branch "${{ steps.upsert-pr.outputs.pr_url }}"
